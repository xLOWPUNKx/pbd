<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Analisis PBD</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{--accent:#0d9488}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f1ec;color:#1d2321;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;padding:20px}
  .card{background:#fff;border:1px solid #e4e1d8;border-radius:20px;padding:32px 28px;max-width:440px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(20,30,25,.06)}
  .logo{width:64px;height:64px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;margin:0 auto 16px}
  h1{font-size:22px;margin:0 0 6px}
  p{color:#68716d;margin:0 0 20px}
  a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px}
  .small{font-size:12.5px;margin-top:18px;color:#8a928e}
</style>
</head>
<body>
<div class="card">
  <div class="logo">PBD</div>
  <h1>Dashboard Analisis PBD</h1>
  <p id="msg">Membuka dashboard… Anda mungkin diminta log masuk dengan akaun Google sekolah.</p>
  <a class="btn" id="go" href="#">Buka Dashboard PBD</a>
  <div class="small">Akses hanya untuk warga sekolah yang diberi kebenaran oleh pentadbir PBD.</div>
</div>
<script>
  // ▼▼▼ TAMPAL PAUTAN WEB APP (/exec) DI ANTARA TANDA PETIK DI BAWAH ▼▼▼
  var DASHBOARD_URL = 'https://script.google.com/macros/s/AKfycbzBdsrZY1H2UP0xkcISzc9-YqkHP2usmlcOxqDC8Cz_kGQ1o6JKvVXvt30OWjYUO4ta/exec';
  // ▲▲▲ JANGAN UBAH APA-APA LAGI ▲▲▲

  var ok = /^https:\/\/script\.google\.com\/.+\/exec/.test(DASHBOARD_URL);
  var go = document.getElementById('go');
  if (ok) {
    go.href = DASHBOARD_URL;
    setTimeout(function () { location.replace(DASHBOARD_URL); }, 800);
  } else {
    document.getElementById('msg').textContent = 'Pautan dashboard belum ditetapkan. Pentadbir: edit fail index.html di GitHub dan tampal pautan /exec.';
    go.style.display = 'none';
  }
</script>
</body>
</html>
