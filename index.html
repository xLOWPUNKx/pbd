<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analisis PBD · SMK SP</title>
<meta name="robots" content="noindex, nofollow">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3f1ec; font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: #1d2321; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; }
  #loading b { display: block; font-size: 18px; margin-bottom: 6px; }
  #loading a { color: #0d9488; font-weight: 600; }
</style>
</head>
<body>
<div id="loading">
  <div>
    <b>⏳ Memuatkan Dashboard Analisis PBD…</b>
    <span id="hint">Sila tunggu sebentar.</span>
  </div>
</div>
<iframe id="app" title="Dashboard Analisis PBD" allow="clipboard-write; fullscreen"></iframe>
<script>
  // ▼▼▼ TAMPAL PAUTAN WEB APP (/exec) DI ANTARA TANDA PETIK DI BAWAH ▼▼▼
  var DASHBOARD_URL = 'TAMPAL_PAUTAN_EXEC_DI_SINI';
  // ▲▲▲ JANGAN UBAH APA-APA LAGI ▲▲▲

  var ok = /^https:\/\/script\.google\.com\/.+\/exec/.test(DASHBOARD_URL);
  var hint = document.getElementById('hint');
  if (!ok) {
    hint.textContent = 'Pautan dashboard belum ditetapkan. Pentadbir: edit fail index.html di GitHub dan tampal pautan /exec.';
  } else {
    // Bawa bahagian #tab (cth. #murid) ke dalam dashboard
    document.getElementById('app').src = DASHBOARD_URL + (location.hash || '');
    setTimeout(function () {
      hint.innerHTML = 'Jika dashboard tidak muncul, <a href="' + DASHBOARD_URL + '">buka terus di sini</a>.';
    }, 8000);
  }
</script>
</body>
</html>
